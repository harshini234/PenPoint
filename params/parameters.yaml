# =============================================================================
# BRD Decision Aid — PARAMETER LEDGER (single source of truth)
# =============================================================================
# Every number the generator, model, simulator or dashboard uses lives here.
#
# tag:
#   Obs        = observed / reported in the cited source (copy it exactly)
#   Est        = estimated by us from cited sources (show the arithmetic in notes)
#   Assume     = our assumption; justify in notes; must be shown as such in the UI
#   Calibrated = fitted by scripts/calibrate.py so the generator reproduces Obs targets
#
# verified: set to true ONLY after a teammate opens the source and confirms the
#           value AND the location (page / table). Add your initials in verified_by.
#
# location: "p5" = page in the PDF; "abstract" = only the abstract has been read
#           (pull full text before final submission); "secondary" = the number is
#           cited inside another paper — confirm against the primary source.
# =============================================================================

