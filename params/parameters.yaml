# ---------------------------------------------------------------- intervention effects
- id: meta_rr_morbidity
  group: intervention
  description: Relative risk of BRD morbidity with arrival metaphylaxis vs none
  value: 0.50
  low: 0.35
  high: 0.75
  unit: ratio
  tag: Est
  source: horton2023
  location: abstract (7.3% vs 17.2% => RR 0.42); rojas2022 p11 Table 3 assumes 0.5
  used_in: [generator, simulator]
  verified: false
  notes: Point 0.5 follows Rojas; range spans Horton RCT (0.42) and Baptiste 2017 'highly variable' effects.
- id: meta_rr_mortality
  group: intervention
  description: Relative risk of mortality with metaphylaxis vs pull-and-treat (medium risk)
  value: 0.44
  low: 0.30
  high: 0.80
  unit: ratio
  tag: Est
  source: horton2023
  location: abstract (1.1% vs 2.5%)
  used_in: [simulator]
  verified: false
- id: meta_doses_per_head
  group: intervention
  description: Antimicrobial doses per animal enrolled - metaphylaxis program
  value: 1.1
  unit: doses/head
  tag: Obs
  source: horton2023
  location: abstract
  used_in: [simulator_amu]
  verified: false
- id: pt_doses_per_head
  group: intervention
  description: Antimicrobial doses per animal enrolled - pull-and-treat program
  value: 0.2
  unit: doses/head
  tag: Obs
  source: horton2023
  location: abstract
  used_in: [simulator_amu]
  verified: false
- id: arrival_vaccine_effect
  group: intervention
  description: Effect of vaccination at/near arrival on BRD diagnosis (not credited)
  value: 1.0
  unit: ratio
  tag: Obs
  source: oconnor2019vax
  location: abstract ('little compelling evidence')
  used_in: [risk_model]
  verified: false
  notes: Deliberately set to no effect; pre-arrival vaccination handled separately.

