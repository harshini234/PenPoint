# Four FICTIONAL yards representing the operating differences the brief asks for.
# All values here are team assumptions (tag: Assume) unless noted. Names are invented.
# hospital_pen_head = hospital spaces free for new BRD cases; spare_rider_hours_per_day = rider time
# available beyond routine checks (for extra passes). Both are the binding constraints in the feasibility step.
# Locations are approximate regions only (used for haul distance and weather lookups).

